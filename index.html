<!DOCTYPE html>
<html lang="ru">
<head>

        :root { --bg:#f4f7fa; --fg:#1a2b3c; --muted:#5c6b7a; --accent:#1B4D6E; --card:#ffffff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.55; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border-radius: 16px; padding: 20px; margin: 16px 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
    </style>
</head>
<body>
